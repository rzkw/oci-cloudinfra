name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  terraform-fmt:
    name: terraform-fmt
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest
      - run: terraform fmt -check -recursive terraform/

  terraform-validate:
    name: terraform-validate
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest
      - name: Init and validate vcn
        working-directory: terraform/vcn
        run: |
          terraform init -backend=false
          terraform validate
      - name: Init and validate instances
        working-directory: terraform/instances
        run: |
          terraform init -backend=false
          terraform validate
      - name: Init and validate bastion
        working-directory: terraform/bastion
        run: |
          terraform init -backend=false
          terraform validate
      - name: Init and validate budget
        working-directory: terraform/budget
        run: |
          terraform init -backend=false
          terraform validate

  terraform-docs:
    name: terraform-docs
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - name: Check module docs are up to date
        uses: terraform-docs/gh-actions@v1
        with:
          find-dir: terraform/
          output-file: README.md
          output-method: check
          fail-on-diff: true

