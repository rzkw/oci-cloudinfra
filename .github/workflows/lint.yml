name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  terraform-fmt:
    name: terraform-fmt
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest
      - run: terraform fmt -check -recursive terraform/

  terraform-validate:
    name: terraform-validate
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest
      - name: Init and validate vcn
        working-directory: terraform/vcn
        run: |
          terraform init -backend=false
          terraform validate
      - name: Init and validate instances
        working-directory: terraform/instances
        run: |
          terraform init -backend=false
          terraform validate

